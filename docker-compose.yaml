services:
  mcp:
    build: ./mcp
    image: ghcr.io/pranjallk1995/luna-lumia-mcp:latest
    working_dir: /workspace/mcp
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:?Set LUNA_SSO_URL to Luna Sentia's public sign-on address}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      DATABASE_URL: postgresql://lunalumia:${POSTGRES_PASSWORD:-lunalumia-dev}@luna-sentia-db:5432/lunalumia
      LUNALUMIA_API_TOKEN: ${LUNALUMIA_API_TOKEN:?Set LUNALUMIA_API_TOKEN to a random value of at least 32 characters}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:18002}
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-http://localhost:18503}
      LUNAVIBIA_API_URL: ${LUNAVIBIA_API_URL:-http://luna-vibia-mcp:8000}
      LUNAVIBIA_API_TOKEN: ${LUNAVIBIA_API_TOKEN:-}
      LUNAVISIA_API_URL: ${LUNAVISIA_API_URL:-http://luna-visia-mcp:8000}
      LUNAVISIA_COMPANION_TOKEN: ${LUNAVISIA_COMPANION_TOKEN:-}
      LUNALUMIA_ICUE_TOKEN: ${LUNALUMIA_ICUE_TOKEN:-}
      LUNALUMIA_ICUE_TOKENS: ${LUNALUMIA_ICUE_TOKENS:-}
      TZ: Asia/Kolkata
    expose: ["8000"]
    ports: ["127.0.0.1:18002:8000"]
    develop:
      watch:
        - action: sync+restart
          path: ./mcp/app
          target: /workspace/mcp/app
        - action: rebuild
          path: ./mcp/requirements.txt
        - action: rebuild
          path: ./mcp/Dockerfile
    networks:
      sentia_network:
        aliases: [luna-lumia-mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    image: ghcr.io/pranjallk1995/luna-lumia-ui:latest
    working_dir: /workspace/ui
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:?Set LUNA_SSO_URL to Luna Sentia's public sign-on address}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      LUNALUMIA_API_URL: http://luna-lumia-mcp:8000
      LUNALUMIA_API_TOKEN: ${LUNALUMIA_API_TOKEN:?Set LUNALUMIA_API_TOKEN to a random value of at least 32 characters}
      LUNALUMIA_ALLOWED_EMAILS: ${LUNALUMIA_ALLOWED_EMAILS:?Set LUNALUMIA_ALLOWED_EMAILS to the Google accounts allowed to control Lumia}
      TZ: Asia/Kolkata
    ports: ["127.0.0.1:18503:8501"]
    develop:
      watch:
        # The gateway restarts on Python changes; the browser app is built into the image.
        - action: sync+restart
          path: ./ui
          target: /workspace/ui
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - .pytest_cache/
            - requirements.txt
            - Dockerfile
            - web/
        - action: rebuild
          path: ./ui/web/src
        - action: rebuild
          path: ./ui/web/package.json
        - action: rebuild
          path: ./ui/requirements.txt
        - action: rebuild
          path: ./ui/Dockerfile
    networks:
      sentia_network:
        aliases: [luna-lumia-ui]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mcp:
        condition: service_healthy

networks:
  sentia_network:
    external: true
    name: luna_sentia_network
