services:
  mcp:
    build: ./mcp
    image: ghcr.io/pranjallk1995/luna-lumia-mcp:${LUNA_IMAGE_TAG:-v2.0.0}
    working_dir: /workspace/mcp
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:-http://localhost:19001}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      DATABASE_URL: postgresql://lunalumia:${POSTGRES_PASSWORD:-lunalumia-dev}@luna-sentia-db:5432/lunalumia
      LUNALUMIA_API_TOKEN: ${LUNALUMIA_API_TOKEN:-lunalumia-dev-token-for-localhost-only}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:18002}
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-http://localhost:18502}
      LUNAVIBIA_API_URL: ${LUNAVIBIA_API_URL:-http://luna-vibia-mcp:8000}
      LUNAVIBIA_API_TOKEN: ${LUNAVIBIA_API_TOKEN:-lunavibia-dev-token-for-localhost-only}
      LUNAVISIA_API_URL: ${LUNAVISIA_API_URL:-http://luna-visia-mcp:8000}
      LUNAVISIA_COMPANION_TOKEN: ${LUNAVISIA_COMPANION_TOKEN:-lunavisia-companion-dev-token-for-localhost-only}
      LUNALUMIA_ICUE_TOKEN: ${LUNALUMIA_ICUE_TOKEN:-}
      LUNALUMIA_ICUE_TOKENS: ${LUNALUMIA_ICUE_TOKENS:-}
      TZ: Asia/Kolkata
    expose: ["8000"]
    ports: ["127.0.0.1:18002:8000"]
    develop:
      watch:
        - action: sync+restart
          path: ./mcp/app
          target: /workspace/mcp/app
        - action: rebuild
          path: ./mcp/requirements.txt
        - action: rebuild
          path: ./mcp/Dockerfile
    networks:
      sentia_network:
        aliases: [luna-lumia-mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    image: ghcr.io/pranjallk1995/luna-lumia-ui:${LUNA_IMAGE_TAG:-v2.0.0}
    working_dir: /workspace/ui
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:-http://localhost:19001}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      LUNALUMIA_API_URL: http://luna-lumia-mcp:8000
      LUNALUMIA_API_TOKEN: ${LUNALUMIA_API_TOKEN:-lunalumia-dev-token-for-localhost-only}
      LUNALUMIA_ALLOWED_EMAILS: ${LUNALUMIA_ALLOWED_EMAILS:-}
      TZ: Asia/Kolkata
    ports: ["127.0.0.1:18502:8501"]
    develop:
      watch:
        # The gateway restarts on Python changes; the browser app is built into the image.
        - action: sync+restart
          path: ./ui
          target: /workspace/ui
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - .pytest_cache/
            - requirements.txt
            - Dockerfile
            - web/
        - action: rebuild
          path: ./ui/web/src
        - action: rebuild
          path: ./ui/web/package.json
        - action: rebuild
          path: ./ui/requirements.txt
        - action: rebuild
          path: ./ui/Dockerfile
    networks:
      sentia_network:
        aliases: [luna-lumia-ui]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mcp:
        condition: service_healthy

  # The iCUE bridge on the PC with the Corsair lights (bridge/icue_bridge.py), as host:port (port 6743).
  # Only a health check: started by `luna.sh start` after the app (profile "host"), so a service that is
  # down shows unhealthy in `docker ps` without stopping the app from starting. Blank LUNALUMIA_ICUE_WATCH: it exits.
  corsair:
    image: ghcr.io/pranjallk1995/luna-lumia-mcp:${LUNA_IMAGE_TAG:-v2.0.0}
    profiles: ["host"]
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    environment:
      WATCH: ${LUNALUMIA_ICUE_WATCH:-}
    entrypoint: ["sh", "-c", "test -n \"$$WATCH\" || exit 0; exec sleep infinity"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; host, port = os.environ['WATCH'].rsplit(':', 1); socket.create_connection((host, int(port)), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 5s

  # OpenRGB's SDK server on the PC with the other RGB lights, as host:port (port 6742).
  # Only a health check: started by `luna.sh start` after the app (profile "host"), so a service that is
  # down shows unhealthy in `docker ps` without stopping the app from starting. Blank LUNALUMIA_OPENRGB_WATCH: it exits.
  pc-rgb:
    image: ghcr.io/pranjallk1995/luna-lumia-mcp:${LUNA_IMAGE_TAG:-v2.0.0}
    profiles: ["host"]
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    environment:
      WATCH: ${LUNALUMIA_OPENRGB_WATCH:-}
    entrypoint: ["sh", "-c", "test -n \"$$WATCH\" || exit 0; exec sleep infinity"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; host, port = os.environ['WATCH'].rsplit(':', 1); socket.create_connection((host, int(port)), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 5s

networks:
  sentia_network:
    external: true
    name: luna_sentia_network
